<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Cashmaxx: an AI agent with a guarded USDC wallet">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b222c" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%"><stop offset="0" stop-color="#34d399" stop-opacity="0.16"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  </defs>
  <rect width="1280" height="620" rx="24" fill="#0d1117"/>
  <rect width="1280" height="620" rx="24" fill="url(#g)"/>
  <rect width="1280" height="620" rx="24" fill="url(#glow)"/>
  <rect y="420" width="1280" height="200" fill="url(#fade)"/>
  <g transform="translate(590,70)">
    <rect width="100" height="100" rx="26" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
    <text x="50" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#34d399">$</text>
    <g transform="translate(66,18)" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 18 L18 0"/><path d="M6 0 H18 V12"/></g>
  </g>
  <text x="640" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#f0f6fc">Cashmaxx</text>
  <text x="640" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9aa4b2">An AI agent that tries to earn more than it costs,</text>
  <text x="640" y="328" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9aa4b2">with a guarded USDC wallet and you in control.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9aa4b2" text-anchor="middle">
    <text x="640" y="380">budget caps · approvals · kill switch · honest P&amp;L</text>
  </g>
  
  <g transform="translate(196,430)">
    <rect width="262" height="84" rx="16" fill="#161b22" stroke="#2d333b" stroke-width="1.5"/>
    <g transform="translate(20,26)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="26" height="20" rx="6"/><circle cx="10" cy="17" r="2"/><circle cx="20" cy="17" r="2"/><path d="M15 7V2"/></g>
    <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#f0f6fc">Agent</text>
    <text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa4b2">thinks, codes, browses</text>
  </g>
  <g transform="translate(474,472)" stroke="#9aa4b2" stroke-width="2" fill="none" stroke-linecap="round"><path d="M0 0h26"/><path d="M19 -6 L26 0 L19 6"/></g>
  
  <g transform="translate(516,430)">
    <rect width="262" height="84" rx="16" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
    <g transform="translate(20,26)" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2 L27 7 V15 C27 22 21.5 27.5 15 30 C8.5 27.5 3 22 3 15 V7 Z"/><path d="M10 16 l3.5 3.5 L20 12"/></g>
    <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#f0f6fc">Guard</text>
    <text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa4b2">your rules, holds the keys</text>
  </g>
  <g transform="translate(794,472)" stroke="#9aa4b2" stroke-width="2" fill="none" stroke-linecap="round"><path d="M0 0h26"/><path d="M19 -6 L26 0 L19 6"/></g>
  
  <g transform="translate(836,430)">
    <rect width="262" height="84" rx="16" fill="#161b22" stroke="#2d333b" stroke-width="1.5"/>
    <g transform="translate(20,26)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="26" height="20" rx="4"/><path d="M2 12h26"/><circle cx="22" cy="19" r="1.6"/></g>
    <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#f0f6fc">Wallet</text>
    <text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa4b2">USDC on Base</text>
  </g>
  <text x="640" y="566" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#fbbf24">The agent can only ask. The guard decides, and you approve.</text>
</svg>
